name: Deploy lecture replay gallery

on:
  push:
    branches: [main]
    paths:
      - "experiments/lecture_replays/**"
      - ".github/workflows/deploy-lecture-gallery.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload gallery
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/lecture_replays
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
